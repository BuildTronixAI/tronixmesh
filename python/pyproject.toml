[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tronixmesh"
version = "0.3.0"
description = "Tronix Mesh Phase B runtime — proof-native envelopes, coordinates, provenance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
tronixmesh-ops = "tronixmesh.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tronixmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
